<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Analysis</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#f5fbff,#ffffff);
    color:#1d3557;
}

header{
    background:#1678c2;
    color:white;
    text-align:center;
    padding:35px;
    box-shadow:0 8px 24px rgba(22,120,194,.25);
}

header h1{
    font-size:38px;
    margin-bottom:8px;
}

.container{
    width:88%;
    max-width:1150px;
    margin:35px auto;
}

.back-btn{
    display:inline-block;
    text-decoration:none;
    background:#1678c2;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    margin-bottom:25px;
    font-weight:bold;
}

.back-btn:hover{
    background:#0e5f9b;
}

.card{
    background:white;
    border-radius:18px;
    padding:28px;
    margin-bottom:25px;
    border:1px solid #dcefff;
    box-shadow:0 10px 25px rgba(22,120,194,.12);
}

.card h3{
    color:#1678c2;
    margin-bottom:14px;
    font-size:22px;
}


.btn{
    text-decoration:none;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
}

.primary{
    background:#1678c2;
    color:white;
}

.filename{
    font-size:20px;
    font-weight:bold;
}

textarea{
    width:100%;
    height:320px;
    resize:vertical;
    border:1px solid #cde7ff;
    background:#f8fcff;
    border-radius:10px;
    padding:15px;
    line-height:26px;
}

.summary{
    height:300px;
}

.category{
    background:#edf7ff;
    border-left:5px solid #1678c2;
    border-radius:10px;
    padding:16px;
    line-height:28px;
    white-space:pre-wrap;
}

.ask-box{
    display:flex;
    gap:15px;
    align-items:center;
    flex-wrap:wrap;
}

.ask-btn{
    display:inline-block;
    text-decoration:none;
    background:#1678c2;
    color:white;
    padding:14px 22px;
    border-radius:8px;
    font-weight:bold;
}

.ask-btn:hover{
    background:#0e5f9b;
}

.info{
    color:#5b6777;
}

</style>
</head>

<body>

<header>
<h1>📄 Document Analysis</h1>
<p>AI-generated analysis of your uploaded document.</p>
</header>

<div class="container">

<a href="/" class="back-btn">⬅ Back to Home</a>

<div class="card">
<h3>Filename</h3>
<p class="filename">{{ filename }}</p>
</div>

<div class="card">
<h3>AI Summary</h3>
<textarea class="summary" readonly>{{ summary }}</textarea>
</div>

<div class="card">
<h3>Document Category</h3>
<div class="category">{{ category }}</div>
</div>

<div class="card">
<h3>Extracted Text</h3>
<textarea readonly>{{ text }}</textarea>
</div>

<div class="card">
<h3>Ask AI About this Document</h3>
<div class="ask-box">
<div class="info">
Ask questions about this document using the local Gemma 3 model.
</div>

<div class = "btn primary">
<a  href="/ask/{{ file_id }}?from=process">🤖 Ask AI</a>
</div>

</div>
</div>

</div>

</body>
</html>
