<!DOCTYPE html>
<html>
<head>
    <title>Semantic Search Results</title>
    <style>
        body {
            background: #e8f4fc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #0b4f81;
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        .result-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .filename {
            color: #0b4f81;
            font-weight: bold;
            font-size: 18px;
        }

        .chunk {
            margin-top: 8px;
            white-space: pre-wrap;
        }

        .score {
            color: gray;
            font-size: 14px;
            margin-top: 6px;
        }

        .back-btn {
            display: inline-block;
            background-color: #1d7ddc;
            margin-bottom: 20px;
            text-decoration: none;
            padding: 10px 16px;
            color: white;
            border-radius: 6px;
        }

        .back-btn:hover {
            background-color: #1368b5;
        }

    </style>
</head>

<body>

<div class="container">

    <a href="/upload" class="back-btn">← Back to Process Page</a>

    <h2>Best Matching Results</h2>

    {% for r in results %}
        <div class="result-box">
            <div class="filename">{{ r.filename }}</div>
            <div class="chunk">{{ r.chunk }}</div>
            <div class="score">Similarity: {{ r.score }}</div>
        </div>
    {% endfor %}

</div>

</body>
</html>
